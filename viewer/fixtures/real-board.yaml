task: first-board-explanation
content:
  - text: |
      # The board viewer, explained on itself

      This board is the first real content of the read-only viewer. It
      explains what the viewer is, what it deliberately does not do, and
      which decisions remain open. It cites the source of every claim it
      carries. A separate contributor owns the fuller migration content;
      this board is a working draft that exercises every feature the
      reader must handle.

      ## What this component is

      A retained, read-only research reader: it renders an explicitly
      supplied declaration and nothing else. Opening a board never
      touches tracker storage, authority, or workflow. The `task` field
      above is authored metadata, not a tracker association.

      ## Unchanged foundations

      The record is the only durable memory. Understanding is the
      limiting resource the system serves. There is one human; multi-human
      support would be a law change, not a surprise.
  - incorporation:
      id: axioms
      source:
        task: saccade-axioms
        revision: a015b6e7c8d940f2a1b2c3d4e5f60718293a4b5c
        select: [/content/0/text]
      content:
        - text: |
            The paragraph above restates two axioms in ordinary language.
            The claim shown here is exactly what the declaration says: a
            task name, a revision hash, and a select path. The viewer
            renders that claim; it validates nothing. Provenance is
            displayed honestly or not at all.
  - group:
      title: Ratified content behavior
      relation: comparison
      content:
        - text: |
            **Math is core.** Inline math like $0 < a < b$ and display math:

            $$\eta = \frac{a}{b}$$

            render at natural size. A display expression wider than the
            column scrolls in its own area; prose still wraps. An
            indivisible inline expression may overflow naturally rather
            than shrink.
        - text: |
            **Diagrams are core.** A mermaid fence is an ordinary fence:

            ```mermaid
            flowchart LR
              declaration --> read-model
              read-model --> board
            ```

            It renders as a figure, never captures gestures while
            embedded, and expands on activation. Rendering failure keeps
            the authored source visible.
        - text: |
            **Ordinary fences never execute.** Code is displayed as
            written:

            ```python
            def factor(eta, b):
                return 1 - eta * b  # displayed, never run
            ```
  - annotation: |
      Review note authored with the board: the incorporation claim above
      is a demo of honest provenance display, not an acceptance
      statement. The revision hash is a placeholder for this draft.
  - text: |
      ## Open decisions carried by the record

      Input schema beyond the provisional YAML adapter, navigation data
      for real project locations, and the ordinary-check timing budget
      are decided in their own threads, one at a time. This board does
      not pre-empt them.

      Search this page for `eta` and every math occurrence is one logical
      unit; copy in Source mode keeps authored bytes, Plain mode gives
      the TeX value.
  - figure:
      path: assets/loop-figure.svg
      caption: A small retained figure resolved relative to this declaration.
