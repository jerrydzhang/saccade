[package]
name = "saccade-board-viewer"
version = "0.1.0"
description = "Saccade read-only board viewer"
edition = "2021"

[lib]
name = "saccade_board_viewer_lib"
path = "src/lib.rs"

[[bin]]
name = "saccade-board-viewer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
webkit2gtk = { version = "2" }
serde_json = "1"

[profile.release]
strip = true
lto = true
