[package]
name = "saccade-app"
version = "0.1.0"
description = "The Saccade app: the suite's windows and instruments"
edition = "2021"

[lib]
name = "saccade_app_lib"
path = "src/lib.rs"
# the core-client crate below: its contract tests run in the fast
# check loop without any GUI dependency

[[bin]]
name = "saccade-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# managed by the package build (buildFeatures): a production binary
# serves the embedded dist instead of dialing the dev server
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
# the close detach: one fire-and-retry POST when a bound window dies
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
webkit2gtk = { version = "2" }
gtk = "0.18"
serde_json = "1"
toml = "0.9"
saccade-app-core = { path = "core-client" }
# the shared board grammar: admission runs here, on the Tauri side, so
# the frontend never grows a second validator
board-grammar = { path = "../../grammar" }
