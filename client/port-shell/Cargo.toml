[package]
name = "saccade-app-port"
version = "0.1.0"
description = "The Saccade port's binary: the shared Rust shell around the port frontend (t-36 phase-3 slice 1)"
edition = "2021"

# the port's own workspace root: the repo's root workspace stays
# untouched (the existing saccade-app build must not change), and a
# standalone workspace stops cargo's upward search here
[workspace]

# The shared shell: the lib target compiles the SAME lib.rs and modules
# the packaged app ships (client/src-tauri/src), under this package's
# manifest directory. The tauri context macro reads THIS crate's
# tauri.conf.json (the port conf, frontendDist ../port/dist), so the
# binary embeds the port frontend while the shell source stays one
# copy. The old tree's crate is not a dependency and its build inputs
# are untouched.
[lib]
name = "saccade_app_port_lib"
path = "../src-tauri/src/lib.rs"

[[bin]]
name = "saccade-app-port"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# managed by the package build (buildFeatures): a production binary
# serves the embedded dist instead of dialing the dev server
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
# the close detach: one fire-and-retry POST when a bound window dies
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
webkit2gtk = { version = "2" }
gtk = "0.18"
serde_json = "1"
toml = "0.9"
saccade-app-core = { path = "../src-tauri/core-client" }
# the shared board grammar: admission runs here, on the Tauri side, so
# the frontend never grows a second validator
board-grammar = { path = "../../grammar" }
