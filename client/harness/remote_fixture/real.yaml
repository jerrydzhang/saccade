task: t-0
content:
  - text: |
      This board is served by a second private core inside the
      development sandbox. The viewer reaches it through the local
      core's mesh: the machine names the location, and every read is
      the bridge's ordinary read-only wire.

      The first figure below is real bytes on that machine. The second
      is a symlink that leaves the declaration directory; the remote
      containment check must refuse it with an addressed error, never
      bytes.
  - figure:
      path: assets/figure.png
      caption: Real bytes, arrived through the mesh.
  - figure:
      path: escaped.png
      caption: Leaves the declaration directory on purpose.
