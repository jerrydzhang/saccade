      ## The deck's slide

      This board is the deck cue's end-to-end target in the remote
      mesh lane: the agent side appends its location to the deck
      document on machine b, the viewer's cue feed picks the landing
      up, and the slide shown here is the proof the deck moved the
      window's view through the real doc store and the real mesh read.

