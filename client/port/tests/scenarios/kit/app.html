<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Saccade (browser suite)</title>
    <!-- vitest rewrites the app's dynamic imports (mermaid, mathjax)
    into __vitest_browser_runner__.wrapDynamicImport, a global only the
    test page has: lend it to this realm before any module runs -->
    <script>
      window.__vitest_browser_runner__ = window.parent.__vitest_browser_runner__;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../../../src/main.ts"></script>
  </body>
</html>
