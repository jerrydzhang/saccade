        - text: |
            Kept because the answer leans on the recorded update factors, the
            contraction window $0<\eta<2/b$, and the scope note that this
            account concerns this exact quadratic, not arbitrary losses. The
            behaviors it covers: at $\eta=0.01$ the b-factor is $0$ and the
            a-factor $0.99$ decays monotonically and slowly; at $\eta=0.019$
            the b-factor $-0.9$ alternates while decaying quickly and the
            a-factor $0.981$ still decays monotonically and slowly.
