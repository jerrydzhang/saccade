# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  { id = "ascii-authored-text", name = "authored text is ASCII",
    entry = "sh", language = "system",
    args = ["-c", "status=0; LC_ALL=C git grep --cached -I -n -e '[^ -~\t]' -- . || status=$?; if [ \"$status\" -eq 0 ]; then echo 'non-ASCII byte(s) above: authored text is ASCII; runtime Unicode goes in source escapes, prose takes ASCII punctuation' >&2; exit 1; fi; if [ \"$status\" -gt 1 ]; then echo \"ascii check could not scan the index (git grep status $status)\" >&2; exit 1; fi"],
    pass_filenames = false, always_run = true },
  { id = "saccade-native-typecheck", name = "native extension typechecks against the pinned SDK",
    entry = "bash", language = "system",
    args = ["tracker/native/typecheck.sh"],
    pass_filenames = false, always_run = true },
]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/FeryET/pre-commit-rust"
rev = "v1.2.1"
hooks = [
  { id = "fmt", args = ["--all"], pass_filenames = false, always_run = true },
  { id = "cargo-check" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "merge-gate", name = "merge gate: the full suite and the #all build",
    entry = "bash", language = "system",
    args = ["-c", '''
set -eu
# the push hands the hook git's own env: every scratch repo the tests
# build would resolve against this checkout's git dir without the scrub
unset $(git rev-parse --local-env-vars) 2>/dev/null || true
cargo test -q
sha="${PRE_COMMIT_TO_REF:-}"
case "$sha" in "" | *0000000000000000000000000000000000000000*) exit 0 ;; esac
repo="$(git rev-parse --path-format=absolute --git-common-dir)"
repo="${repo%/.git}"
nix build --no-link "git+file://$repo?rev=$sha#all"
'''],
    pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
