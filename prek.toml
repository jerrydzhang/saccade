# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
#
# The root carries no shell: a hook that needs the projects' tools
# enters a project's shell itself (direnv exec saccade, nix develop
# .#app), as the justfiles' recipes do.

[[repos]]
repo = "local"
hooks = [
  { id = "ascii-authored-text", name = "authored text is ASCII",
    entry = "sh", language = "system",
    args = ["-c", "status=0; LC_ALL=C git grep --cached -I -n -e '[^ -~\t]' -- . || status=$?; if [ \"$status\" -eq 0 ]; then echo 'non-ASCII byte(s) above: authored text is ASCII; runtime Unicode goes in source escapes, prose takes ASCII punctuation' >&2; exit 1; fi; if [ \"$status\" -gt 1 ]; then echo \"ascii check could not scan the index (git grep status $status)\" >&2; exit 1; fi"],
    pass_filenames = false, always_run = true },
  { id = "no-tracker-refs-in-code", name = "code comments carry no tracker references",
    entry = "python3", language = "system",
    args = ["check-no-tracker-refs.py"],
    pass_filenames = false, always_run = true },
  { id = "saccade-native-typecheck", name = "native extension typechecks against the pinned SDK",
    entry = "direnv", language = "system",
    args = ["exec", "saccade", "bash", "saccade/tracker/native/typecheck.sh"],
    pass_filenames = false, always_run = true },
  { id = "port-unit", name = "the port's unit project passes (vitest)",
    entry = "sh", language = "system",
    args = ["-c", "direnv exec saccade just client-deps && cd app && nix develop ..#app -c node_modules/.bin/vitest run -c port/vitest.config.ts --project unit --silent"],
    pass_filenames = false, always_run = true },
  { id = "nix-fmt", name = "nix files are formatted (nixfmt; just fmt fixes)",
    entry = "direnv", language = "system",
    args = ["exec", "saccade", "nixfmt", "--check"],
    files = '\.nix$' },
]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

# the rust hooks over the two cargo workspaces: fmt covers saccade's
# members and the app's core client (the app shell's sources are not
# under fmt), cargo check the saccade workspace (the app shell builds
# only with the app shell's GTK/WebKit libraries)
[[repos]]
repo = "local"
hooks = [
  { id = "fmt", name = "fmt", entry = "direnv", language = "system",
    args = ["exec", "saccade", "cargo", "fmt", "--all", "--manifest-path", "saccade/Cargo.toml"],
    pass_filenames = false, always_run = true, stages = ["pre-commit", "pre-merge-commit", "manual"] },
  { id = "fmt-app-core", name = "fmt (app core client)", entry = "direnv", language = "system",
    args = ["exec", "saccade", "cargo", "fmt", "--manifest-path", "app/Cargo.toml", "-p", "saccade-app-core"],
    pass_filenames = false, always_run = true, stages = ["pre-commit", "pre-merge-commit", "manual"] },
  { id = "cargo-check", name = "cargo check", entry = "direnv", language = "system",
    args = ["exec", "saccade", "cargo", "check", "--manifest-path", "saccade/Cargo.toml"],
    files = '^.*(Cargo\.toml|Cargo\.lock|.*\.rs)$', pass_filenames = false,
    stages = ["pre-commit", "pre-merge-commit", "pre-push", "manual"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "merge-gate", name = "merge gate: the full suite (just test) and the #all build",
    entry = "bash", language = "system",
    args = ["-c", '''
set -eu
# the push hands the hook git's own env: every scratch repo the tests
# build would resolve against this checkout's git dir without the scrub
unset $(git rev-parse --local-env-vars) 2>/dev/null || true
# the full suite: saccade's and the app's (justfile test), just from
# the saccade shell
direnv exec saccade just test
sha="${PRE_COMMIT_TO_REF:-}"
case "$sha" in "" | *0000000000000000000000000000000000000000*) exit 0 ;; esac
repo="$(git rev-parse --path-format=absolute --git-common-dir)"
repo="${repo%/.git}"
nix build --no-link "git+file://$repo?rev=$sha#all"
'''],
    pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
