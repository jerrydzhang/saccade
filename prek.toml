# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  { id = "ascii-authored-text", name = "authored text is ASCII",
    entry = "sh", language = "system", args = ["-c", "if LC_ALL=C git grep --cached -I -n -e '[^ -~\t]' -- .; then echo 'non-ASCII byte(s) above: authored text is ASCII; runtime Unicode goes in source escapes, prose takes ASCII punctuation' >&2; exit 1; fi"],
    pass_filenames = false },
]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/FeryET/pre-commit-rust"
rev = "v1.2.1"
hooks = [
  { id = "fmt" },
  { id = "cargo-check" },
]
