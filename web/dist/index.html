<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saccade</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="work" aria-label="Working panes"></main>
<div id="leader" hidden></div>
<footer id="bar" aria-label="Focused buffer">
<span id="bar-mode">NORMAL</span> <span id="bar-kind">Home</span> <span id="bar-ident">home</span> <span id="bar-info"></span> <span id="bar-flags">[-]</span>
<button id="open-commands" title="Open commands" aria-label="Open commands">...</button>
</footer>
<div id="message" role="status" aria-live="polite"></div>
<dialog id="picker" aria-labelledby="picker-title">
<header><h2 id="picker-title"></h2><button id="picker-close">Cancel</button></header>
<label class="query-label">Search <input id="query" type="text" autocomplete="off" spellcheck="false"></label>
<div class="picker-body"><div id="results" role="listbox" aria-label="Matching material"></div><section id="picker-preview" aria-label="Selected material preview"></section></div>
<footer><button id="choose">Open / select</button><button id="beside">Open beside</button><span id="picker-hint">Up/Down preview | Enter select | Shift+Enter beside | Escape cancel</span></footer>
</dialog>
<dialog id="title-dialog" aria-labelledby="title-heading">
<h2 id="title-heading">Authored title</h2>
<label>The concise whole-contribution description <input id="title-input" type="text" autocomplete="off"></label>
<footer><button id="title-apply">Set title</button><button id="title-cancel">Cancel</button></footer>
</dialog>
<dialog id="publication" aria-labelledby="publication-title">
<header><h2 id="publication-title">Confirm submission</h2><button id="edit-note">Return to editing</button></header>
<div class="review-fields">
<span id="review-kind"></span>
<span id="review-fixed-home"></span>
<label id="review-home-label">Home task <select id="review-home"></select></label>
<div id="review-title-row">Title: <span id="review-title"></span></div>
<div>By: <span id="review-by"></span> <input id="review-actor-name" type="text" placeholder="your name" autocomplete="name" hidden></div>
</div>
<section><h3>References</h3><ol id="review-references"></ol></section>
<p id="publication-status" role="status"></p>
<footer><button id="publish" disabled>Publish once</button><button id="inspect-task">Inspect task record</button></footer>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
