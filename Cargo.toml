[package]
name = "saccade"
version = "0.4.2"
edition = "2024"

[[bin]]
name = "sac"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.6.6", features = ["derive", "env"] }
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "local-offset", "formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
proptest = "1.11"
