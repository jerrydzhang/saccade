[workspace]
resolver = "2"
# bare cargo commands cover the tracker and the grammar crate; the
# app's read-only core client joins the workspace for the single lock
# (the app's own GTK/WebKit crate is client/port-shell, its own
# workspace root)
members = [
    "tracker",
    "grammar",
    "companion",
    "client/src-tauri/core-client",
]
default-members = ["tracker", "grammar", "companion"]

[profile.release]
strip = true
lto = true
